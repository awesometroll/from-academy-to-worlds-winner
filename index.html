         let g=(pool.get(gamePairKey(a,b))||[]).find(x=>!used.has(x));
         if(g){r.push(g);used.add(g)}

function playerAcceptChance(kind,ask,offer,years,round){
 const p=me(),t=kind==='renew'?teamOf(p):s.world.teams[s.negotiation?.team];
 if(!t)return 0;
 const gap=ask-offer,ratio=gap/Math.max(1,offer);
 const loyalty=kind==='renew'?.12:0;
 const roleFit=clamp((power(t)-avg(p.stats)+25)/60,.15,.9);
 return clamp(.82-ratio*.9-Math.max(0,years-2)*.08+loyalty+roleFit*.12-(round-1)*.08,.08,.94);
}
function beginPlayerNegotiation(i){
 const o=s.offers?.[i];if(!o)return;
 if(Number(s.contract)>0||!s.contractPending){alert('현재 계약이 남아 있어 이적 협상을 시작할 수 없습니다. 계약 만료 후 다시 이용하세요.');return;}
 s.negotiation={kind:'transfer',team:o.team,baseSalary:o.salary,baseYears:Math.min(2,o.years||2),round:1,offerIndex:i,history:[]};
 negotiationRound();
}
function beginRenewalNegotiation(){
 const p=me(),t=teamOf(p),base=Math.max(salaryFloorForLeague(t.league),offerSalary(t,p),Number(s.salary)||0);
 s.negotiation={kind:'renew',team:t.id,baseSalary:Math.round(base/10)*10,baseYears:Math.min(2,Math.max(1,s.contract||1)),round:1,history:[]};
 negotiationRound();
}
function negotiationRound(){
 const n=s.negotiation;if(!n)return;
 const p=me(),t=s.world.teams[n.team];if(!t)return;
 const floor=salaryFloorForLeague(t.league),base=Math.max(floor,n.baseSalary);
 const prev=n.history[n.history.length-1];
 const suggested=prev?.counterSalary||base;
 const salaryText=prompt(`${t.name} 계약 협상 (${n.round}/3라운드)\n희망 연봉(만원)을 입력하세요. 최소 ${floor}만원\n구단 기준 제시액: ${suggested}만원`,String(suggested));
 if(salaryText===null){s.negotiation=null;return}
 const salary=Math.round(Number(salaryText));
 if(!Number.isFinite(salary)||salary<floor||salary>1000000){alert(`연봉은 ${floor}만원 이상, 유효한 숫자로 입력해야 합니다.`);return negotiationRound()}
 const yearsText=prompt('계약 기간을 선택하세요 (1~2년).','2');
 if(yearsText===null){s.negotiation=null;return}
 const years=Number(yearsText);if(!Number.isInteger(years)||years<1||years>2){alert('계약 기간은 1년 또는 2년입니다.');return negotiationRound()}
 const cap=Math.max(floor,Math.round(base*(1.22-(years-1)*.07)/10)*10);
 const chance=playerAcceptChance(n.kind,salary,cap,years,n.round);
 const accepted=salary<=cap&&Math.random()<chance;
 n.history.push({salary,years,accepted});
 if(accepted){
  if(n.kind==='renew'){s.salary=salary;s.contract=years;s.contractPending=false;s.offers=[];s.negotiation=null;logMove('재계약',p,t.name,t.name,`연봉 ${salary}만 원 · ${years}년`);news(`📝 ${t.name}과 재계약 합의 · ${years}년 / 연봉 ${salary}만 원`)}
  else {const offer=s.offers[n.offerIndex];offer.salary=salary;offer.years=years;acceptOffer(n.offerIndex)}
  s.negotiation=null;save();render();return;
 }
 if(n.round>=3){alert('협상 3라운드가 종료되어 구단이 최종 결렬을 선언했습니다.');s.negotiation=null;save();render();return}
 const counterSalary=Math.max(floor,Math.round((salary>cap?(salary+cap)/2:Math.min(cap,salary*1.04))/10)*10);
 n.history[n.history.length-1].counterSalary=counterSalary;
 const response=confirm(`구단이 제안을 그대로 수락하지 않았습니다.\n구단 역제안: 연봉 ${counterSalary.toLocaleString()}만원 · 계약 ${years}년\n다음 라운드에서 다시 협상할까요?`);
 if(!response){s.negotiation=null;save();render();return}
 n.baseSalary=counterSalary;n.round++;negotiationRound();
}
function aiTransferFee(p){

 if(!remaining)return 0;
 const salary=Math.max(salaryFloorForLeague(p.league),Number(p.salaryAI)||offerSalary(s.world.teams[p.team],p));

function processAIContractExpiries(){
 for(const p of Object.values(s.world.players)){
  if(p.player||p.retired||p.team==='FA')continue;
  const t=s.world.teams[p.team];if(!t)continue;
  if(!p.contractUntil){p.contractYears=Math.round(r(1,2));p.contractUntil=s.year+p.contractYears;p.salaryAI=Math.max(salaryFloorForLeague(p.league),offerSalary(t,p));continue}
  if(p.contractUntil>s.year)continue;
  const expiryKey=String(p.contractUntil);if(p.lastResolvedContractUntil===expiryKey)continue;
  p.lastResolvedContractUntil=expiryKey;
  const floor=salaryFloorForLeague(t.league),current=Math.max(floor,Number(p.salaryAI)||offerSalary(t,p));
  const renewal=Math.random()<clamp(.72+(avg(p.stats)-65)*.004-(p.age>29?.12:0),.25,.9);
  if(renewal){p.contractYears=Math.round(r(1,2));p.contractUntil=s.year+p.contractYears;p.salaryAI=Math.max(floor,Math.round(current*r(.96,1.14)/10)*10);logMove('AI 재계약',p,t.name,t.name,`연봉 ${p.salaryAI}만 원 · ${p.contractYears}년`)}

 }
}

agePlayer=function(p){
 if(!p?.player||!TYPE_GROWTH_ATTRS[p.type])return _agePlayerTypeBase(p);
 const row=RATES.find(x=>p.age<=x[0])||RATES[RATES.length-1],attrs=TYPE_GROWTH_ATTRS[p.type];
 p.stats=p.stats.map((v,i)=>{const focused=!!p.player&&s.focus.includes(i),lo=row[focused?3:1],hi=row[focused?4:2];let d=r(lo,hi);if(attrs.includes(i))d*=d>0?1.2:.8;const limit=v>88?.30:v>78?.60:1;return rnd(clamp(v+d*(d>0?limit:1),20,99))});
 p.condition=clamp(p.condition+r(-8,9),42,100);
 if(attrs.includes('trust')){let td=r(-.16,.21);td*=td>0?1.2:.8;p.trust=clamp((Number(p.trust)||65)+td,0,100)}
 if(!p.player)checkAIRetirement(p);
};
const _simulateMatchPOMBase=simulateMatch;
simulateMatch=function(a,b,bo=3,important=false,matchContext={}){
 const before={};for(const teamName of [a,b])for(const pl of activeLineup(s.world.teams[teamName]))before[pl.id]=Number(pl.trust)||58;
 const result=_simulateMatchPOMBase(a,b,bo,important,matchContext);if(!result)return result;
 const candidates=activeLineup(s.world.teams[result.winner]);
 if(candidates.length){const ranked=candidates.map(pl=>({pl,score:avg(effective(pl))+r(-6,6)+(pl.team===result.winner?3:0)+(Number(pl.trust)-60)*.04})).sort((x,y)=>y.score-x.score);const p=ranked[0].pl;result.pom={id:p.id,name:p.name,team:p.team}}
 for(const teamName of [a,b])for(const pl of activeLineup(s.world.teams[teamName]))if(pl.player&&pl.type==='팀플레이 메이커'&&before[pl.id]!=null){const d=(Number(pl.trust)||58)-before[pl.id];pl.trust=clamp(before[pl.id]+d*(d>0?1.2:.8),0,100)}
 return result;
};

function pomCompetitionName(ev){return typeof competitionIdentity==='function'?competitionIdentity(ev):String(ev?.name||'').trim()}
function pomCompetitionGroups(){
 const groups={};
 for(const ev of (s.tournaments||[])){
  const n=String(ev?.name||'');
  if(n.includes('MSI')||n.includes('미드 시즌 인비테이셔널')||n.toLowerCase().includes('worlds')||n.includes('월즈'))continue;
  const title=pomCompetitionName(ev),key=String(ev.year)+'|'+title;
  const g=groups[key]??={year:ev.year,name:title,counts:{}};
  const games=Array.isArray(ev.matches)?ev.matches:(ev.rounds||[]).flatMap(x=>x.games||[]);
  for(const game of games){
   if(!game?.pom?.id)continue;
   const id=game.pom.id,row=g.counts[id]??={id,name:game.pom.name,team:game.pom.team,count:0};
   row.count++;
  }
 }
 return Object.values(groups).filter(g=>Object.keys(g.counts).length);
}
function pomCareerHTML(){
 const mine=me(),achievements=pomCompetitionGroups().filter(g=>{
  const row=g.counts[mine.id];if(!row)return false;
  return row.count===Math.max(...Object.values(g.counts).map(x=>x.count));
 }).sort((a,b)=>b.year-a.year||a.name.localeCompare(b.name,'ko'));
 return '<h3>🏅 POM 대회 1위 기록</h3>'+(
  achievements.length?achievements.map(g=>'<span class="pill">'+esc(g.year)+'년 '+esc(g.name)+' · '+g.counts[mine.id].count+'회</span>').join(''):
  '<p class="muted">아직 POM 대회 1위 기록이 없습니다.</p>'
 );
}
window.pomOpenKey=window.pomOpenKey||'';
function togglePomArchiveAll(){window.pomArchiveOpen=!window.pomArchiveOpen;render()}
function pomArchiveAllHTML(){
 const groups=archiveGroups();
 if(!groups.length)return '<p class="muted">대회 기록이 없습니다.</p>';
 return groups.map(g=>pomArchiveHTMLForGroup(g)).join('');
}
function togglePomArchive(index){const g=archiveGroups()[index];if(!g)return;window.pomOpenKey=window.pomOpenKey===g.key?'':g.key;render()}
function togglePomArchiveSplit(groupIndex,splitIndex){
 const group=archiveGroups()[groupIndex],split=group?.splits[splitIndex];if(!group||!split)return;
 const key=group.key+'::'+split.name;
 window.pomOpenKey=window.pomOpenKey===key?'':key;render();
}
function pomArchiveHTMLForSplit(split){
 const counts={};
 for(const ev of split.stages){
  const games=Array.isArray(ev.matches)?ev.matches:(ev.rounds||[]).flatMap(x=>x.games||[]);
  for(const game of games){if(!game?.pom?.id)continue;const row=counts[game.pom.id]??={id:game.pom.id,name:game.pom.name,team:game.pom.team,count:0};row.count++}
 }
 const a=Object.values(counts).sort((x,y)=>y.count-x.count||x.name.localeCompare(y.name,'ko'));
 if(!a.length)return '<h3>🏅 '+esc(split.name)+' POM 순위</h3><p class="muted">집계된 POM 기록이 없습니다.</p>';
 const mine=me(),shown=a.slice(0,7);
 return '<h3>🏅 '+esc(split.name)+' POM 순위 TOP 7</h3><div class="scroll"><table><tr><th>순위</th><th>선수</th><th>팀</th><th>POM</th></tr>'+shown.map((p,i)=>{const first=a.findIndex(x=>x.count===p.count),tied=a.filter(x=>x.count===p.count).length>1;return '<tr class="'+(p.id===mine.id?'selected':'')+'"><td>'+(tied?'공동 '+(first+1)+'위':(i+1)+'위')+'</td><td>'+esc(p.name)+(p.id===mine.id?' ★':'')+'</td><td>'+esc(p.team)+'</td><td>'+p.count+'회</td></tr>'}).join('')+'</table></div>';
}
function pomArchiveHTMLForGroup(group){
 const counts={};
 for(const ev of group.splits.flatMap(x=>x.stages)){
  const games=Array.isArray(ev.matches)?ev.matches:(ev.rounds||[]).flatMap(x=>x.games||[]);
  for(const game of games){if(!game?.pom?.id)continue;const row=counts[game.pom.id]??={id:game.pom.id,name:game.pom.name,team:game.pom.team,count:0};row.count++}
 }
 const a=Object.values(counts).sort((x,y)=>y.count-x.count||x.name.localeCompare(y.name,'ko'));
 if(!a.length)return '<h3>🏅 POM 순위</h3><p class="muted">집계된 POM 기록이 없습니다.</p>';
 const mine=me(),top=a[0].count;
 const shown=a.slice(0,7);
 return '<h3>🏅 POM 순위 TOP 7</h3><div class="scroll"><table><tr><th>순위</th><th>선수</th><th>팀</th><th>POM</th></tr>'+shown.map((p,i)=>{const first=a.findIndex(x=>x.count===p.count),tied=a.filter(x=>x.count===p.count).length>1;return '<tr class="'+(p.id===mine.id?'selected':'')+'"><td>'+(tied?'공동 '+(first+1)+'위':(i+1)+'위')+'</td><td>'+esc(p.name)+(p.id===mine.id?' ★':'')+'</td><td>'+esc(p.team)+'</td><td>'+p.count+'회</td></tr>'}).join('')+'</table></div>';
}
